name: Build and publish Mac app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  updater-flow:
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test updater flow on this Mac architecture
        run: |
          uname -m
          npm test

  mac-release:
    needs: updater-flow
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Require release credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name. Configure Developer ID signing and Apple notarization secrets before publishing." >&2
              exit 1
            fi
          done

      - name: Install Developer ID signing identity
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/assisted-writer-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # The exported bundle contains two certificates with the same name.
          # Keep the 2026 Developer ID identity so codesign has one match.
          security delete-certificate -Z 6C6F1294F4B46C5406FA2630399507974969B1FE "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          [[ "$(grep -c 'Developer ID Application' <<< "$identities")" -eq 1 ]]
          grep -q '7059DC84A57FAD07AA7721BBAE6C47749AE89637' <<< "$identities"
          rm "$certificate"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Set release version
        id: version
        run: |
          base_version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$base_version" ]] || { echo "Tag must match package.json version." >&2; exit 1; }
            release_version="$base_version"
            prerelease=false
          else
            release_version="${base_version}-beta.${GITHUB_RUN_NUMBER}"
            prerelease=true
            npm version "$release_version" --no-git-tag-version --ignore-scripts
          fi
          echo "base=$base_version" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and notarize universal Mac app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BASE_VERSION: ${{ steps.version.outputs.base }}
        run: npm run package:mac -- --config.mac.bundleShortVersion="$BASE_VERSION" --config.mac.bundleVersion="$GITHUB_RUN_NUMBER"

      - name: Verify signed packages
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="release/mac-universal/Assisted Writer.app"
          verify_app() {
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl --assess --type execute --verbose=4 "$1"
            xcrun stapler validate "$1"
          }
          verify_app "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/Assisted Writer")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          build_number="$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")"
          [[ "$app_version" == "$BASE_VERSION" && "$build_number" == "$GITHUB_RUN_NUMBER" ]]
          [[ "$(node -p 'require("./package.json").version')" == "$RELEASE_VERSION" ]]
          hdiutil verify release/*.dmg
          unzip -t release/*-mac.zip > /dev/null
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" release/*.dmg
          verify_app "$mount_dir/Assisted Writer.app"
          hdiutil detach "$mount_dir"
          zip_dir="$(mktemp -d)"
          unzip -q release/*-mac.zip -d "$zip_dir"
          verify_app "$zip_dir/Assisted Writer.app"
          for artifact in release/*.dmg release/*-mac.zip; do
            safe_name="$(basename "$artifact" | tr ' ' '.')"
            if [[ "$(basename "$artifact")" != "$safe_name" ]]; then
              mv "$artifact" "release/$safe_name"
            fi
          done
          test -f release/latest-mac.yml
          # GitHub normalizes spaces in uploaded asset names to periods. Keep
          # electron-updater's metadata in sync with the names it will fetch.
          sed -i '' 's/Assisted-Writer/Assisted.Writer/g' release/latest*.yml
          (cd release && shasum -a 256 *.dmg *-mac.zip > SHA256SUMS.txt)

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          release_flags=(--target "$GITHUB_SHA" --title "Assisted Writer $RELEASE_VERSION" \
            --notes "Universal Mac build for Intel and Apple Silicon from commit $GITHUB_SHA. Signed with Developer ID and notarized by Apple.")
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--verify-tag --latest)
          fi
          gh release create "$RELEASE_TAG" release/*.dmg release/*-mac.zip release/SHA256SUMS.txt \
            release/latest*.yml "${release_flags[@]}"

app = "assisted-writer-relay"
primary_region = "iad"

[env]
  RELAY_PUBLIC_ORIGIN = "https://assisted-writer-relay.fly.dev"

[build]
  dockerfile = "relay/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
